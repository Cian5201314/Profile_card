<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Profile Card</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

</head>
<body>
    <section class="profile-card">
        <div class="avatar-box">
            <img alt="Profile Avatar" class="avatar-img" src="avater.png">
        </div>

        <h1 class="name">Garlic</h1>
        <h2 class="role">Web Developer</h2>
        <div class="skills">
            <div class="box1">
                html
            </div>
            <div class="box2">
                css
            </div>
            <div class="box3">
                javascript
            </div>
        </div>
        <div class="contact icon-large">
            <a href="01-234 567 89" class="fas fa-phone"></a>
            <a href="https://facebook.com" class="fab fa-facebook"></a>
            <a href="https://instagram.com" class="fab fa-instagram "></a>
            <a href="https://telegram.com" class="fab fa-telegram"></a>
            <a href="https://reddit.com" class="fab fa-reddit"></a>
            <a href="https://linkedin.com" class="fab fa-facebook"></a>
            <a href="https://github.com" class="fab fa-github"></a>
        </div>
    </section>
</body>
</html>
